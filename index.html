    }

    /* ---------- the list of spheres ---------- */
    function plateHTML(s, now){
      var st = sphereState(s, now), ink = grpInk(s.color);
      return '<div class="splate' + (st.on ? ' on' : '') + (st.off ? ' isoff' : '') + '" data-id="' + esc(s.id) + '" style="--sc:' + s.color + ';--sci:' + ink + '">' +
        '<div class="st-t">' + (s.main ? '<span class="st-main">Основная</span>' : '') +
          '<div class="st-n"><i></i><span>' + esc(s.name || 'Без названия') + '</span></div><div class="st-s">' + esc(st.text) + '</div></div>' +
        // §8.1: the main sphere (the base) has neither the switch nor «Настроить»
        (s.main ? '' : '<div class="st-row">' + s3HTML(['off', 'auto', 'on'], ['Выкл', CLOCK_ICO, 'Вкл'], s.mode, 'smode', 'Включение сферы', [0, 'По расписанию', 0]) +

        '<button type="button" class="btn btn-secondary sadd" data-a="add">Добавить и настроить сферу деятельности</button>';
    }

    });
    /* ---------- §3.9: the presentation at the bottom of the window — on the first opening, later by «?» in the header ---------- */
    var INTRO = [
      ['Что такое сфера', 'Задачи делятся по сферам — например, работа и дом. В каждое время на экране задачи нужной сферы.'],
      ['Расписание', '«Всегда», дни недели или даты (можно целыми месяцами), часы — по желанию. Без часов сфера активна весь день: если не ограничить часы, например у рабочей сферы, она будет доступна круглосуточно. Когда ни одна сфера не работает, на карточке переключателя — «Сфера не настроена».'],
      ['Выкл, по расписанию, Вкл', 'Переключатель на табличке: по расписанию (значок часов) — сфера работает по расписанию; «Вкл» — активна всегда; «Выкл» — сфера скрыта во всех разделах. Пока своих сфер нет, все задачи — в основной сфере; первая добавленная сфера забирает их себе.'],
      ['Переключатель сфер', 'Карточки внизу экрана, слева от «+». Нажмите на карточку — вперёд выйдет следующая сфера. Выбор временный: он сбрасывается при выходе из приложения или смене раздела. Скрыть переключатель можно в параметрах интерфейса.'],
      ['Совмещение', 'В «Сводке» видны все активные сферы вместе. В «Управлении», «Архиве» и «Отчётах» открывается та, что сейчас «в разгаре», — остальные открываются переключателем.']
    ];
    var INTRO_KEY = 'planner_sph_intro_v1', introOn = false;
    function introSeen(){ try{ return localStorage.getItem(INTRO_KEY) === '1'; }catch(_){ return false; } }
    function renderIntro(){
      var box = $('sphIntro'); if(!box) return;
      if(!introOn){ box.innerHTML = ''; return; }
      box.innerHTML = '<div class="sintro"><div class="si-track" id="siTrack">' + INTRO.map(function(c, i){
          return '<div class="si-card"><div class="si-n">' + (i + 1) + ' / ' + INTRO.length + '</div><div class="si-t">' + esc(c[0]) + '</div><div class="si-x">' + esc(c[1]) + '</div></div>';
        }).join('') + '</div><div class="si-foot"><div class="si-dots">' + INTRO.map(function(_, i){ return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('') + '</div>' +
        '<button type="button" class="btn btn-primary si-ok" id="siOk">Понятно</button></div></div>';

      if(a === 'add'){ openCfg(null); return; }
      if(!s) return;

    });

      if(openState || busy) return;

      fx.play(true, panel).then(function(){ busy = false; if(openState) fx.hideBehind(true); });
    }

      fx.hideBehind(false);
      fx.play(false, panel).then(function(){

      });
    }
    $('sphBack').addEventListener('click', close);
    // a change (here or from another device), and once a minute the states: the list is redrawn, «Настроить» is left alone
    refreshSphereViews = function(){
      if(!openState || cfg || busy) return;
      var st = body.scrollTop; renderList(); body.scrollTop = st;
    };

    /* ---------- «Настроить» ---------- */
    var T = function(){ return settings.ui; };
    function openCfg(id, onSaved){
      if(cfg || cbusy) return;
      var s = id ? sphereById(id) : null;
      var mx = spheres.reduce(function(m, x){ return Math.max(m, x.order); }, 0);
      var d = s ? JSON.parse(JSON.stringify(s))
                : normSphere({ id: uid(), name: '', color: newSphereColor(), order: mx + 1, createdAt: Date.now() });
      cfg = { d: d, isNew: !s, themesOpen: false, calMore: false, calMonths: false, onSaved: onSaved || null };
      renderCfg();
      cov.hidden = false; cbody.scrollTop = 0;
      if(cfg.isNew){ var ni = cbody.querySelector('.scfg-name'); try{ ni.focus({ preventScroll: true }); }catch(_){ ni.focus(); } }   // in the same tap: the keyboard comes up
      cbusy = true;
      var a = cpanel.animate([{ transform: 'translateY(18px) scale(.97)', opacity: 0 }, { transform: 'none', opacity: 1 }],
                             { duration: reduce ? 1 : 300, easing: 'cubic-bezier(.3,.8,.25,1)' });
      a.finished.catch(function(){}).then(function(){ cbusy = false; });
    }
    function closeCfg(save){
      if(!cfg || cbusy) return;
      var a0 = document.activeElement; if(a0 && cov.contains(a0) && a0.blur) a0.blur();
      if(save){
        var d = cfg.d;
        d.name = String(d.name || '').trim().slice(0, 40) || (cfg.isNew ? 'Новая сфера' : (sphereById(d.id) || {}).name || 'Сфера');
        d.staff.managers = d.staff.managers.map(function(v){ return String(v || '').trim(); }).filter(Boolean);
        d.staff.executors = d.staff.executors.map(function(v){ return String(v || '').trim(); }).filter(Boolean);
        persistSphere(d, true);
        if(cfg.isNew && cfg.onSaved){ var cb = cfg.onSaved; setTimeout(function(){ cb(d.id); }, 0); }
      }
      cbusy = true;
      var a = cpanel.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(18px) scale(.97)', opacity: 0 }],
                             { duration: reduce ? 1 : 240, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
      a.finished.catch(function(){}).then(function(){
        cov.hidden = true; a.cancel(); cbody.innerHTML = ''; cfg = null; cbusy = false;
        cov.style.paddingTop = ''; cov.style.paddingBottom = '';

      });
    }
    $('scfgBack').addEventListener('click', function(){ closeCfg(true); });
    window.addEventListener('keydown', function(e){
      if(e.key !== 'Escape' || !overlay.hidden) return;
      if(cfg){ e.preventDefault(); closeCfg(true); } else if(openState){ e.preventDefault(); close(); }
    });

    function sec(title, inner, id, note){
      return '<div class="scfg-sec"' + (id ? ' id="' + id + '"' : '') + '><div class="uigrp-t">' + title + '</div>' + inner + (note ? '<p class="snote">' + note + '</p>' : '') + '</div>';
    }
    function renderCfg(){
      var d = cfg.d;
      ctitle.textContent = d.name || (cfg.isNew ? 'Новая сфера' : 'Без названия');
      var html = '';
      html += sec('Название', '<input type="text" class="scfg-name" maxlength="40" enterkeyhint="done" autocomplete="off" aria-label="Название сферы">');
      html += sec('Цвет', '<div class="scols">' + SPH_COLORS.map(function(c){
        return '<button type="button" class="scol' + (d.color === c ? ' on' : '') + '" data-c="' + c + '" style="--gc:' + c + '" aria-label="Цвет ' + c + '"><i></i></button>';
      }).join('') + '</div>', null, 'Цвет сферы — в этом окне, в окне выбора сферы для новой задачи и на её табличке. На папках задач метки сферы нет.');
      html += '<div id="scDays"></div><div id="scHours"></div>';
      if(!d.main) html += '<div id="scPause"></div>';
      html += '<div id="scTheme"></div>';
      html += sec('Метка приоритета', '<input type="text" class="scfg-imp" maxlength="14" enterkeyhint="done" autocomplete="off" aria-label="Метка приоритета сферы">', null,
        'Своё слово на папке важной задачи этой сферы.');

    /* §8.4: deleting a sphere. Several own spheres and the sphere has tasks: «Куда деть задачи …» — the other own spheres except

    function askDelete(id, name){

      var n = tasks.filter(function(t){ return t.sphereId === id && !t.noSphere; }).length, last = userSpheres().length <= 1;
      var nm = esc(String(name || '').trim() || (sphereById(id) || {}).name || 'Сфера');

    /* §6: «Расписание» — «Всегда | Дни недели | Даты»; §10: under the calendar «Показать больше» and «Указать месяцы» */
    function calMonthsList(){

        else {
          var now = new Date(), y1 = now.getFullYear(), tk = monthKey(y1, now.getMonth()), col = function(y){
            var h = ''; for(var k = 0; k < 12; k++){ var key = monthKey(y, k);
              h += '<button type="button" class="ctrlcell ctrlcell-month' + (key < tk ? ' past' : '') + (key === tk ? ' today-ctrl' : '') + (d.days.months.indexOf(key) >= 0 ? ' marked' : '') +
                '" data-mk="' + key + '">' + MONTH_SHORT_RU[k] + ' ' + y + '</button>'; }
            return '<div class="ctrlcol">' + h + '</div>'; };

        }

          '<button type="button" class="addstage" id="scMonths">' + (cfg.calMonths ? 'Указать даты' : 'Указать месяцы') + '</button></div>';
      }

  /* ================= Переключатель сфер (v42; был полосой сфер v39–v41) =================
     The cards in the order of the options of the section (as the faces of the bar went when turned «down»): in «Сводке» with
     several spheres working — first all of them together («Работа + Дом»), then each one («Работа», then «Дом»), then again.
     A tap brings the card behind to the front; on the last one the first comes again. One option only: a tap shows the hint. */
  function createSphereBar(){
    var appEl = document.getElementById('app'), fab = document.getElementById('fab');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MAXCELLS = 9, DUR = 360;
    var el = document.createElement('div');
    el.className = 'sphsw'; el.id = 'sphBar'; el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-roledescription', 'переключатель сфер');
    appEl.insertBefore(el, fab);

    /* v45: the switcher is there only when at least one sphere has been added; with the base activity alone there is nothing to
       switch between and the switcher is not shown (until the spheres are read, the last known state stands, so the screen does not jump) */
    function shown(){
      if(settings.ui.sphereSwitch === false) return false;
      var has;
      if(dataSeen.spheres){ has = hasUserSpheres(); try{ localStorage.setItem('planner_has_spheres_v1', has ? '1' : '0'); }catch(e){} }
      else { try{ has = localStorage.getItem('planner_has_spheres_v1') === '1'; }catch(e){ has = false; } }
      return has;
    }
    var placed = null;
    function place(){
      var on = shown();
      if(placed === on) return;
      placed = on; el.hidden = !on;
      appEl.classList.toggle('sw-on', on);
      if(kart) kart.relayout();                       // the scene keeps the caption under the cabinet above the switcher
    }
    function faceName(o){ return o.none ? NONE_NAME : o.spheres.map(function(s){ return s.name || 'Сфера'; }).join(' + '); }
    /* the names on a card: 1 — one cell; 2–3 — rows; 4–6 — 2 columns × 3 rows; 7–9 — 3 × 3; filled column by column.
       More than 9 spheres all work, only the first 9 are shown on the card. */
    function gridOf(n){ return n <= 1 ? [1, 1] : n <= 3 ? [1, n] : n <= 6 ? [2, 3] : [3, 3]; }
    function innerHTML(o){
      var list = o.spheres.slice(0, MAXCELLS), n = list.length, g = gridOf(n), cols = g[0], rows = g[1], cells = '';
      for(var c = 0; c < cols; c++) for(var r = 0; r < rows; r++){
        var sp = list[c * rows + r], cls = 'sw-cell' + (c < cols - 1 ? ' br' : '') + (r < rows - 1 ? ' bb' : '');
        cells += '<div class="' + cls + '" style="grid-column:' + (c + 1) + ';grid-row:' + (r + 1) + '">' +
          (sp ? '<span class="sb-nm" style="--sc:' + sp.color + '">' + esc(sp.name || 'Сфера') + '<i></i></span>'
              : o.none ? '<span class="sb-nm none">' + NONE_NAME + '</span>' : '') + '</div>';   // §8.3: no strip of colour
      }
      return '<div class="sw-in' + (n > 1 ? ' nr' : '') + (n > 6 ? ' n9' : '') +
        '" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr));grid-template-rows:repeat(' + rows + ',1fr)">' + cells + '</div>';
    }
    // a single long name that does not fit takes a smaller letter (then the end is cut with «…»)
    function fit(box){
      box.querySelectorAll('.sw-in:not(.nr) .sb-nm').forEach(function(nm){ if(nm.scrollWidth > nm.clientWidth + 1) nm.classList.add('sm'); });
    }
    function at(k){ var n = view.opts.length; return view.opts[((view.idx + k) % n + n) % n]; }
    function backs(){ return 2; }                // always two cards behind (with one or two options the same come round again)
    function card(o, slot){ return '<div class="sw-card ' + slot + '" aria-hidden="true">' + innerHTML(o) + '</div>'; }
    // the cards from the back to the front (the front card last, so it is on top also before the classes are read)
    function build(){
      var b = backs(), h = '';
      for(var k = b; k >= 1; k--) h += card(at(k), 'p' + k);
      el.classList.remove('anim');
      el.innerHTML = h + card(at(0), 'p0');
      fit(el);
      el.setAttribute('aria-label', 'Сфера на экране: ' + faceName(view) + (view.opts.length > 1 ? '. Нажмите, чтобы сменить: дальше — ' + faceName(at(1)) : ''));
    }
    function update(v){
      place();
      var s2 = v.idx + '|' + v.opts.map(function(o){ return o.key + ':' + o.spheres.map(function(s){ return s.name + s.color; }).join(','); }).join('|');
      view = v;
      if(going || s2 === sig) return;
      sig = s2; build();
    }
    // a tap: the front card goes down and away, every card behind comes one place nearer, a new one comes at the back
    function go(){
      if(!view || going) return;
      if(view.opts.length < 2){ showHint(); return; }
      going = true;
      var b = backs(), cards = el.querySelectorAll('.sw-card');            // [p_b … p1, p0]
      var entering = document.createElement('div');
      entering.innerHTML = card(at(b + 1), 'p3'); entering = entering.firstChild;
      el.insertBefore(entering, el.firstChild); fit(entering);
      void el.offsetWidth;                                                  // the new card starts at its place (p3)
      el.classList.add('anim');
      requestAnimationFrame(function(){
        cards[cards.length - 1].className = 'sw-card out';
        for(var i = 0; i < cards.length - 1; i++){ var k = b - i; cards[i].className = 'sw-card p' + (k - 1); }
        entering.className = 'sw-card p' + b;
      });
      if(kart) kart.haptic();
      // v44 §10: the folders change along with the cards (the old ones go at once, the new ones come when they are gone)
      var n = view.opts.length, key = view.opts[((view.idx + 1) % n + n) % n].key;
      var keep = sphSel; sphSel = key; var nv = sphView(); sphSel = keep;
      sphereSwap(function(){ sphSel = key; render(); }, nv);                // a choice for this viewing session
      clearTimeout(goT);
      goT = setTimeout(function(){
        going = false; sig = '';
        update(curView || sphView());
      }, reduce ? 30 : DUR);
    }
    // §4: the hint shows under the cabinet, where «Задач нет» stands
    function showHint(){
      if(!kart) return;
      kart.flash(!hasUserSpheres() ? 'Сейчас одна сфера деятельности, добавьте в меню слева'
        : 'Сейчас активна одна сфера деятельности, добавьте или включите в меню слева');
    }

    el.addEventListener('keydown', function(e){

    });

    return { update: update, place: place, el: el };
  }

  /* ---- §3.8: the theme of the sphere on the screen; it changes under a short dimming, as at the start ---- */
  var veilEl = null, veilBusy = false, veilNext = null;
  function veil(fn){
    if(document.documentElement.classList.contains('booting')){ fn(); return; }   // the app is not shown yet: at once
    if(veilBusy){ veilNext = fn; return; }
    veilBusy = true;
    if(!veilEl){ veilEl = document.createElement('div'); veilEl.className = 'theme-veil'; document.body.appendChild(veilEl); }
    var bgOf = function(){ var tb = document.querySelector('.topbar'); return (tb && getComputedStyle(tb).getPropertyValue('--bg').trim()) || '#000'; };
    veilEl.style.background = bgOf();
    void veilEl.offsetWidth; veilEl.classList.add('on');

      try{ fn(); }catch(e){ console.error(e); }
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){
        veilEl.style.transition = 'opacity .24s ease, background-color .1s'; veilEl.style.background = bgOf();
        veilEl.classList.remove('on');
        setTimeout(function(){
          veilEl.style.transition = ''; veilBusy = false;
          if(veilNext){ var f = veilNext; veilNext = null; veil(f); }
        }, 260);
      }, 90); }); });
    }, 150);
  }
  /* v44 §10: the sphere on the screen changes (the switcher, or the schedule): the folders go and the new ones come
     (kart.swapOut / swapIn); when the theme changes with it, its dimming covers the change and the folders come in after it */
  var swapPendingIn = false, swapPendingT = 0;
  function themeChangesFor(v){
    var lead = v && v.lead, want = (lead && lead.theme && KTHEMES[lead.theme]) ? lead.theme : '';
    if(want === sphThemeNow) return false;
    var base = settings.ui.theme, next = want || (KTHEMES[base] ? base : 'steel');
    return next !== themeId();
  }

    if(nextView && themeChangesFor(nextView)){
      swapPendingIn = true; clearTimeout(swapPendingT); swapPendingT = setTimeout(function(){ swapPendingIn = false; }, 1500);
      apply(); return;
    }
    kart.swapOut(function(){ apply(); kart.swapIn(); });
  }

  function syncSphereTheme(){
    var lead = curView && curView.lead, want = (lead && lead.theme && KTHEMES[lead.theme]) ? lead.theme : '';
    if(want === sphThemeNow || want === sphThemePending) return;
    var base = settings.ui.theme, next = want || (KTHEMES[base] ? base : 'steel');
    if(next === themeId()){ sphThemeNow = want; return; }        // the same look (e.g. the sphere's theme is the common one)
    sphThemePending = want;

      sphThemePending = null; sphThemeNow = want; if(kart) kart.applyUI(); render(); if(rightDrawerOpen) syncSetTabs();

  }

  /* ---- the scene keeps its height while text is being typed ----
     The phone keyboard makes the page lower (in the Android app the whole page is resized). While «Параметры» is open or
     a field has the cursor, the scene with the cabinet keeps the height it had before: the room's background is not drawn
     again and the cabinet neither rises nor shrinks — the keyboard simply covers the lower part. The scene may only grow
     meanwhile; it takes the real height again once the drawer is closed, nothing is typed and the page has stopped
     resizing (by then the keyboard is gone, so nothing moves). */
  (function(){
    var sceneEl = document.getElementById('kart'), boxEl = document.getElementById('content');
    var pinH = 0, unpinT = 0, lastResize = 0;
    function editing(){
      var a = document.activeElement;
      return !!(a && a !== document.body && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable) && !sceneEl.contains(a));
    }
    function want(){ return rightDrawerOpen || editing() || !overlay.hidden || !subOverlay.hidden || !!(projects && projects.isOpen()) || !!(sphWin && sphWin.isOpen()); }
    function setPin(h){ pinH = h; sceneEl.style.bottom = 'auto'; sceneEl.style.height = h + 'px'; }
    function pin(){ clearTimeout(unpinT); if(!pinH){ var h = boxEl.clientHeight; if(h) setPin(h); } }
    var relAt = 0;

      clearTimeout(unpinT);

        if(want()) return;
        if(performance.now() - lastResize < 250){ tryUnpin(true); return; }   // the keyboard is still going away
        if(boxEl.clientHeight < pinH - 8 && performance.now() - relAt < 3500){ tryUnpin(true); return; }   // it has not started to go yet: the page is still low
        pinH = 0; sceneEl.style.bottom = ''; sceneEl.style.height = '';

  /* the first frames are drawn with everything in place: only then is the app shown (see «start-up» in the head);

  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    try{
      var tb = document.querySelector('.topbar'), bg = tb && getComputedStyle(tb).getPropertyValue('--bg').trim();
      if(bg) localStorage.setItem('planner_boot_bg_' + (isDarkNow() ? 'dark' : 'light'), bg);
    }catch(e){}
    var root = document.documentElement;
    if(root.classList.contains('booting')){
      root.classList.remove('booting');
      var app = document.getElementById('app');
      app.classList.add('app-in'); setTimeout(function(){ app.classList.remove('app-in'); }, 400);
    }
  }); });
})();
</script>
</body>
