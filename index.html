  function backupJson(){
    // the backup leaves out the chosen theme and the priority word: they belong to this device's look, not to the data
    var st = JSON.parse(JSON.stringify(settings)); if(st.ui){ delete st.ui.theme; delete st.ui.impText; } delete st.autoDel; delete st.deletedLock;
    return JSON.stringify({ tasks: tasks, groups: groupsSorted(), spheres: spheresSorted(), settings: st, projects: projects ? projects.exportData() : [], deleted: projects ? projects.exportDeleted() : [], exportedAt: new Date().toISOString() }, null, 2);
  }
  /* v47 §9.2: the backup is one ZIP archive (no compression — the pictures and the sound are packed already):
     planner-backup.json with all the data and media/{id of the record}/{file} with the attachments */
  function exportBackup(btn){
    var d = new Date();
    var fname = 'planner-backup-' + d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + '.zip';
    var files = [{ name: 'planner-backup.json', data: new TextEncoder().encode(backupJson()) }, { name: 'media/', data: new Uint8Array(0) }];
    var chain = Promise.resolve();
    (projects && projects.mediaList ? projects.mediaList() : []).forEach(function(m){
      chain = chain.then(function(){
        return ATT.read(m.e, m.f).then(function(b){ return b ? b.arrayBuffer() : null; }).then(function(ab){
          if(ab) files.push({ name: 'media/' + m.e + '/' + m.f, data: new Uint8Array(ab) });
        });
      });
    });
    chain.then(function(){
      var data = ATT.zipBuild(files);
      if(window.claude && window.claude.use){
        window.claude.use('downloads').then(function(downloads){
          if(!downloads){ fallbackDownload(data, fname); return; }
          return downloads.save({ filename: fname, data: data }).then(function(){
            if(btn) flashBtn(btn);
          }).catch(function(e){
            console.error('download failed', e);
            if(e && e.code !== 'declined') fallbackDownload(data, fname);
          });
        }).catch(function(e){
          console.error('downloads capability unavailable', e);
          fallbackDownload(data, fname);
        });
      } else {
        fallbackDownload(data, fname);
      }
    }).catch(function(e){ console.error('export failed', e); });
  }

  function fallbackDownload(data, fname){
    var blob = (typeof Blob !== 'undefined' && data instanceof Blob) ? data : new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function importBackupFile(file, btn){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var media = null, parsed, mp = [], u8 = new Uint8Array(reader.result);
        if(u8[0] === 0x50 && u8[1] === 0x4b){                          // «PK»: the new backup, a ZIP archive
          media = ATT.zipRead(reader.result);
          var jb = media.get('planner-backup.json'); if(!jb) throw new Error('no planner-backup.json');
          parsed = JSON.parse(new TextDecoder().decode(jb));
        } else parsed = JSON.parse(new TextDecoder().decode(u8));      // the former backup: a .json
        /* every task of the backup is added next to the ones already here (nothing is overwritten): it gets a new id
           and a new code that continues the current numbering of its category (ТЕК-007, ТЕК-008, …); the backup's
           own order is kept, and the added tasks come first in the drawer and stay highlighted until their card is opened */
        /* lineage rules: a task of the backup is skipped when a task of its lineage with exactly the same content is
           already here (so loading the same file again adds nothing); otherwise it is added — as an «old version» when
           its lineage is already here, as an ordinary task when it is not. The backup's ordinary tasks are taken first,
           its old versions after them, so on a fresh device the old versions again become old versions of their originals. */
        /* groups (v44 §9 — within a sphere): a group of the backup is matched by its name (letter case and spaces at the
           ends do not matter) among the groups of the sphere here; another one is added with a new id. A task's group is
           looked for in the task's own sphere here (an old backup's shared group gets a copy in each sphere of its tasks);
           a group with no tasks in the backup goes to its own sphere (or the first one). The tasks' links follow. */
        var srcGroups = {}, gmap = {};
        if(parsed && Array.isArray(parsed.groups)) parsed.groups.forEach(function(src){ if(src && src.id) srcGroups[src.id] = src; });
        var groupFor = function(srcId, sid){
          var src = srcGroups[srcId]; if(!src || !sid) return null;
          var k = srcId + '|' + sid; if(gmap[k]) return gmap[k];
          var name = String(src.name || '').trim().slice(0, 40) || 'Группа';
          var same = groupByName(sid, name);
          gmap[k] = same ? same.id : newGroup(name, src.color, sid, true).id;
          return gmap[k];
        };
        /* spheres: the main sphere of the backup is the main sphere here; a sphere whose name is already here (letter case and
           spaces at the ends do not matter) is taken as that sphere; another one is added with a new id (its schedule, colour,
           theme, priority word and staff come along; the manual switch does not). The tasks' links follow. */
        var smap = {};
        if(parsed && Array.isArray(parsed.spheres)){
          var skey = function(n){ return String(n || '').trim().toLowerCase(); };
          var smx = spheres.reduce(function(m, x){ return Math.max(m, x.order); }, 0);
          parsed.spheres.forEach(function(src){
            if(!src || !src.id) return;
            if(src.main || src.id === MAIN_SPH){ smap[src.id] = MAIN_SPH; return; }
            var nm = String(src.name || '').trim().slice(0, 40) || 'Сфера';
            var same = spheres.filter(function(x){ return skey(x.name) === skey(nm); })[0];
            if(same){ smap[src.id] = same.id; return; }
            var ns = normSphere(Object.assign({}, src, { id: uid(), main: false, name: nm, manual: false, mode: src.mode === 'off' ? 'off' : 'auto', order: ++smx, createdAt: Date.now() }));
            persistSphere(ns, true); smap[src.id] = ns.id;
          });
        }
        if(parsed && Array.isArray(parsed.tasks)){
          var inc = parsed.tasks.filter(function(x){ return x && typeof x === 'object'; })
            .sort(function(a, b){ return ((+a.sortAt || +a.updatedAt || 0) - (+b.sortAt || +b.updatedAt || 0)); });
          var base = Date.now();
          inc.forEach(function(x, k){ x.__k = k; });
          inc.filter(function(x){ return !x.oldCopy; }).concat(inc.filter(function(x){ return !!x.oldCopy; })).forEach(function(src){
            var k = src.__k; delete src.__k;
            var type = TYPES[src.type] ? src.type : 'current';
            var t = blankTask(type);
            Object.keys(src).forEach(function(key){ if(key !== 'id' && key !== 'code' && key !== 'oldCopy' && key !== 'origin' && key !== 'imported' && key !== 'mgHide') t[key] = src[key]; });
            t.type = type;
            if(!STATUS[t.status]) t.status = 'unset';
            if(src.sphereId && smap[src.sphereId] && smap[src.sphereId] !== MAIN_SPH) t.sphereId = smap[src.sphereId]; else delete t.sphereId;
            delete t.groupId;
            var lin = String(src.origin || src.id || '');
            var kin = lin ? tasks.filter(function(x){ return lineage(x) === lin; }) : [];
            var sig = contentSig(t);
            if(kin.some(function(x){ return contentSig(x) === sig; })) return;   // the very same version is already here
            var gNew = src.groupId ? groupFor(src.groupId, taskSphId(t)) : null; if(gNew) t.groupId = gNew;
            t.id = uid(); t.code = nextCode(type); t.origin = lin || t.id;
            if(kin.length) t.oldCopy = true;
            t.imported = true; t.sortAt = base + k; t.updatedAt = base + k;
            if(COMPLETED.indexOf(t.status) >= 0) t.doneAt = base + k; else delete t.doneAt;   // finished in the backup: the days count from the import
            if(!isFinite(t.createdAt)) t.createdAt = base + k;
            tasks.push(t);
            if(usingDb && dbCol) dbCol.doc(t.id).set(t).catch(function(e){ console.error(e); });
          });
          if(!(usingDb && dbCol)) saveLocal();
        }
        // the backup's groups none of whose tasks came: into their own sphere here (or the first one), unless one by that name is there
        Object.keys(srcGroups).forEach(function(id){
          if(Object.keys(gmap).some(function(k){ return k.split('|')[0] === id; })) return;
          var src = srcGroups[id], sid = src.sphereId && smap[src.sphereId] && smap[src.sphereId] !== MAIN_SPH ? smap[src.sphereId] : (hasUserSpheres() ? userSpheres()[0].id : MAIN_SPH);
          groupFor(id, sid);
        });
        if(parsed && parsed.settings){
          // the lists of managers and executors are joined (no name twice); the rest of the settings come from the file
          var join = function(a, b){ var out = []; (a || []).concat(b || []).forEach(function(v){ v = String(v || '').trim(); if(v && out.indexOf(v) < 0) out.push(v); }); return out; };
          settings.plannerName = parsed.settings.plannerName || settings.plannerName;
          settings.managers = join(settings.managers, parsed.settings.managers);
          settings.executors = join(settings.executors, parsed.settings.executors);
          if(parsed.settings.shareFmt) settings.shareFmt = normShareFmt(parsed.settings.shareFmt);
          if(parsed.settings.picSrc) settings.picSrc = normPicSrc(parsed.settings.picSrc);
          if(parsed.settings.saveDest) settings.saveDest = normSaveDest(parsed.settings.saveDest);
          if(parsed.settings.deletedKeep) settings.deletedKeep = normDelKeep(parsed.settings.deletedKeep);
          // the theme and the priority word stay as they are here (an older backup that still has them does not change them)
          if(parsed.settings.ui){ var keepTheme = settings.ui.theme, keepWord = settings.ui.impText;
            settings.ui = normUI(parsed.settings.ui); settings.ui.theme = keepTheme; settings.ui.impText = keepWord; }
          if(kart) kart.applyUI();
          persistSettings();
        }
        if(parsed && Array.isArray(parsed.projects) && projects) mp.push(projects.importData(parsed.projects, media));
        if(parsed && Array.isArray(parsed.deleted) && projects) mp.push(projects.importDeleted(parsed.deleted, media));   // v46: the deleted records   // bottom drawer: projects and their records
        if(btn) flashBtn(btn);
        render();
        Promise.all(mp).then(function(rs){
          var sk = 0; rs.forEach(function(r){ if(r) sk += r.skipped; });
          if(sk){
            openSubSheet('<h2>Не все вложения перенесены</h2><div class="sheet-sub">Файлов, которые не удалось скопировать: ' + sk + '. ' +
              (ATT.ok ? 'Не хватило места на устройстве.' : 'Вложения записей хранятся только в приложении для Android.') + ' Записи остались, на месте этих файлов — заглушка.</div>' +
              '<div class="sheet-actions"><button type="button" class="btn btn-primary" id="isOk">Понятно</button></div>');
            var ok = document.getElementById('isOk'); if(ok) ok.addEventListener('click', closeSubSheet);
          }
        });
      }catch(e){
        console.error('import failed', e);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  /* ================= v45 §4: drafts of the forms =================
     While a form (a task, a record of a list) is open, what is typed in it is kept on the device as a draft: 0.5 s after the
     last change and at once when the app goes to the background. If the app is unloaded meanwhile (Android does this to an
     app that has been away for long), the form is opened again with the same content at the next start. The draft is dropped
     when the form is saved, cancelled or closed. Kept only here (localStorage), not in the database and not in a backup. */
  var DRAFT_TASK = 'planner_task_draft_v1', DRAFT_ENTRY = 'planner_entry_draft_v1';
  function draftPut(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }
  function draftGet(key){ try{ var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function draftDel(key){ try{ localStorage.removeItem(key); }catch(e){} }
  var taskDraftFn = null, taskDraftTimer = 0, entryDraftFn = null;      // the open form's «save the draft now» (or null)
  function taskDraftKick(){ if(!taskDraftFn) return; clearTimeout(taskDraftTimer); taskDraftTimer = setTimeout(function(){ if(taskDraftFn) taskDraftFn(); }, 500); }
  function taskDraftEnd(){ clearTimeout(taskDraftTimer); taskDraftFn = null; draftDel(DRAFT_TASK); }
  ['input', 'change', 'click'].forEach(function(ev){ document.addEventListener(ev, taskDraftKick, true); });
  function flushDrafts(){ clearTimeout(taskDraftTimer); if(taskDraftFn) taskDraftFn(); if(entryDraftFn) entryDraftFn(); }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) flushDrafts(); });
  window.addEventListener('pagehide', flushDrafts);
  /* a small question in a window from below (for a draft whose record has changed or is gone) */
  function askDraft(title, text, yesLabel, onYes, onNo){
    var done = false;
    openSheet('<h2>' + title + '</h2><div class="sheet-sub">' + text + '</div>' +
      '<div class="sheet-actions savebar"><button class="btn btn-secondary" id="dqNo">Нет</button><button class="btn btn-primary" id="dqYes">' + yesLabel + '</button></div>');
    mainPull.set(function(){ if(!done){ done = true; closeSheet(); onNo(); } });
    document.getElementById('dqNo').addEventListener('click', function(){ if(done) return; done = true; closeSheet(); onNo(); });
    document.getElementById('dqYes').addEventListener('click', function(){ if(done) return; done = true; closeSheet(); setTimeout(onYes, 200); });
  }


  /* ================= v46: «Удалённые записи» — срок хранения и пароль ================= */
  function pw2(n){ return (n < 10 ? '0' : '') + n; }
  var MONTHS_SH = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  function fmtWhen(ts){ var d = new Date(ts); return d.getDate() + ' ' + MONTHS_SH[d.getMonth()] + ' в ' + pw2(d.getHours()) + ':' + pw2(d.getMinutes()); }
  function fmtDay(ts){ var d = new Date(ts); return d.getDate() + ' ' + MONTHS_SH[d.getMonth()]; }
  function delLockOn(){ var L = settings.deletedLock; return !!(L && L.enabled && L.hash); }
  var delUnlocked = false;                         // the password was entered in this viewing of «Отчёты»
  function delLockActive(){ return delLockOn() && !delUnlocked; }
  /* the time of the server, not of the phone's clock (so the week of waiting cannot be cut short by turning the date on the phone);
     null while there is no connection */
  function serverNow(){
    var srcs = [
      ['https://worldtimeapi.org/api/timezone/Etc/UTC', function(j){ return j && j.unixtime ? j.unixtime * 1000 : null; }],
      ['https://timeapi.io/api/time/current/zone?timeZone=UTC', function(j){ return j && j.dateTime ? Date.parse(String(j.dateTime).slice(0, 19) + 'Z') : null; }]
    ];
    function one(i){
      if(i >= srcs.length) return Promise.resolve(null);
      var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 6000);
      return fetch(srcs[i][0], { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function(r){ return r.json(); }).then(function(j){
        clearTimeout(to); var v = srcs[i][1](j); return (isFinite(v) && v > 1.7e12) ? v : one(i + 1);
      }).catch(function(){ clearTimeout(to); return one(i + 1); });
    }
    return one(0);
  }
  function pwNoCrypto(){ return !(window.crypto && crypto.subtle && window.TextEncoder); }
  function pwHex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function pwSalt(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return pwHex(a); }
  function pwHash(salt, pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function(k){
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, k, 256);
    }).then(pwHex);
  }
  /* while the keyboard comes up: the whole screen is dimmed and a lock (made of the drawer's own parts, so it follows the theme) stands
     in the middle; then it dissolves and the window is seen in its place */
  function lockVeil(){
    var kEl = document.getElementById('kart'); if(!kEl) return;
    var old = kEl.querySelector('.lockveil'); if(old) old.remove();
    var src = kEl.querySelector('.cab .dfront'), hh = src ? Math.round(src.getBoundingClientRect().height) : 116;
    var v = document.createElement('div'); v.className = 'lockveil';
    // v49 §6: the screen's full height, before the keyboard (it may already be coming up and squeezing the page)
    var vv = window.visualViewport, vh = Math.max(window.innerHeight, vv ? vv.height : 0), vw = window.innerWidth;
    /* v49 §6: the lock stands high, in the upper part of the screen: its top at ~6 % of the height (below the status bar),
       the whole lock (shackle and body, 1.62 of the body's height) within ~17 % of the screen — so it ends above the password
       window even with the keyboard up, which takes the lower half */
    hh = Math.max(56, Math.min(hh, Math.round(vh * 0.17 / 1.62)));

    subSheetEl.innerHTML = '<button class="close-x" id="subSheetClose">✕</button><div class="sheet-handle"></div>' + html;
    subOverlay.hidden = false;
    document.getElementById('subSheetClose').addEventListener('click', closeSubSheet);
  }
  function closeSubSheet(){ subPull.set(null); subOverlay.hidden = true; subSheetEl.innerHTML=''; afterSheetClosed(); }

  function openPickList(title, options, currentVal, onPick){
    var html = '<h2>' + esc(title) + '</h2>' +
      '<div class="typegrid">' + (options||[]).map(function(opt){
        return '<button class="typeopt" data-v="' + esc(opt) + '"><div class="name">' + esc(opt) + (opt===currentVal?' ✓':'') + '</div></button>';
      }).join('') + '</div>' +
      (!options || !options.length ? '<div class="hint">Список пуст. Добавьте варианты в параметрах.</div>' : '');
    openSubSheet(html);
    subSheetEl.querySelectorAll('.typeopt').forEach(function(btn){
      btn.addEventListener('click', function(){
        onPick(btn.getAttribute('data-v'));
        closeSubSheet();
      });
    });
  }

  /* ---- «Группа: …»: a row in the task form and in the status window; tapped, it opens right below itself:
     «Убрать из группы», the groups (a tap puts the task there; each has a pencil with «Переименовать» / «Удалить»),
     «+ Новая группа» (a name and «Создать» — the task goes into the new group at once) ---- */
  var GRP_PENCIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/><path d="M13 20h8"/></svg>';
  var GRP_UP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5l6-6 6 6"/></svg>';
  var GRP_CHEV = '<svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>';
  var groupPickers = [];
  function refreshGroupPickers(){
    groupPickers = groupPickers.filter(function(p){ return document.body.contains(p.box); });
    groupPickers.forEach(function(p){ p.refresh(); });
  }
  /* box: an empty element to fill; get(): the group id chosen now; set(id|null): a group was chosen (or removed) */
  /* sphOf(): the sphere whose groups are offered (v44 §9); none — no sphere is chosen yet (or the task has none) */
  function groupPicker(box, get, set, sphOf){
    sphOf = sphOf || function(){ return hasUserSpheres() ? null : MAIN_SPH; };
    box.className = 'grpfield';
    box.innerHTML = '<button type="button" class="grprow" aria-expanded="false"><span>Группа:</span><b></b>' + GRP_CHEV + '</button>' +
      '<div class="stgact grpdrop" inert><div><div class="grpdrop-in"></div></div></div>';
    var row = box.querySelector('.grprow'), drop = box.querySelector('.grpdrop'), list = box.querySelector('.grpdrop-in');
    var openPen = null, editId = null, adding = false, openCol = null, shown = {};
    function label(){ var g = groupById(get()); row.querySelector('b').textContent = g ? g.name : '—'; }
    function setOpen(on){
      box.classList.toggle('open', on); drop.classList.toggle('open', on);
      if(on) drop.removeAttribute('inert'); else drop.setAttribute('inert', '');
      row.setAttribute('aria-expanded', on);
      if(!on){ openPen = null; editId = null; adding = false; openCol = null; }
    }
    // a row opens (or closes) with its animation: it is built in the state it had before, the new state is set a frame later
    function rowHtml(key, on, id, inner, n){
      var was = !!shown[key];
      return '<div class="stgact' + (was ? ' open' : '') + '" data-row="' + key + '" data-on="' + (on ? 1 : 0) + '" data-id="' + esc(id) + '"' + (on ? '' : ' inert') + '>' +
        '<div><div class="stgact-in' + (n ? ' grpcols" style="--n:' + n : '') + '">' + inner + '</div></div></div>';
    }
    function fill(){
      var cur = get(), html = '', defCol = curFace().doneBg;
      var inp0 = list.querySelector('.grpitem:not(.grpnew) .grpname-in'), typed = (inp0 && editId) ? inp0.value : null;   // the name being typed survives
      var sid = sphOf(), sp = sid && sphereById(sid);
      if(groupById(cur)) html += '<button type="button" class="grppick grpout" data-a="out">Убрать из группы</button>';
      if(!sid){                                   // no sphere: there are no groups to offer
        list.style.setProperty('--grp-def', curFace().doneBg);
        list.innerHTML = html + '<p class="grpnote">Группы есть у каждой сферы деятельности. Сначала выберите сферу.</p>';
        shown = {}; return;
      }
      if(sp && !sp.main && userSpheres().length > 1) html += '<p class="grpnote">Группы сферы «' + esc(sp.name || 'Сфера') + '»</p>';
      groupsOf(sid).forEach(function(g){
        var on = g.id === cur, ed = editId === g.id, pen = openPen === g.id || ed, col = openCol === g.id;
        var gc = g.color || 'var(--grp-def)';
        html += '<div class="grpitem" data-id="' + esc(g.id) + '"><div class="grpw">' +
          (ed ? '<input type="text" class="grpname-in" maxlength="40" enterkeyhint="done" aria-label="Название группы">'
              : '<button type="button" class="grppick' + (on ? ' on' : '') + '" data-a="pick">' + esc(g.name) + (on ? ' ✓' : '') + '</button>') +
          '<button type="button" class="grpdot' + (col ? ' on' : '') + '" data-a="color" style="--gc:' + gc + '" aria-label="Цвет группы" aria-expanded="' + col + '"><i></i></button></div>' +
          '<button type="button" class="iconbtn grppen' + (pen ? ' on' : '') + '" data-a="pen" aria-label="' + (pen ? 'Скрыть' : 'Изменить группу') + '">' + (pen ? GRP_UP : GRP_PENCIL) + '</button></div>';
        // the colours: the theme's own first, then the palette; this row stands between the group and its «Переименовать / Удалить»
        var sw = '<button type="button" class="grpsw' + (g.color ? '' : ' on') + '" data-a="setcol" data-c="" style="--gc:var(--grp-def)" aria-label="Цвет темы"><i></i></button>';
        var n = 1;
        GRP_COLORS.forEach(function(c){ if(c !== g.color && grpNear(c, defCol)) return; n++; sw += '<button type="button" class="grpsw' + (g.color === c ? ' on' : '') + '" data-a="setcol" data-c="' + c + '" style="--gc:' + c + '" aria-label="Цвет ' + c + '"><i></i></button>'; });
        html += rowHtml('c' + g.id, col, g.id, sw, n);
        html += rowHtml('p' + g.id, pen, g.id,
          (ed ? '<button type="button" class="stgbtn primary" data-a="save">Сохранить</button><button type="button" class="stgbtn" data-a="cancel">Отмена</button>'
              : '<button type="button" class="stgbtn" data-a="ren">Переименовать</button><button type="button" class="stgbtn danger" data-a="del">Удалить</button>'));
      });
      html += adding
        ? '<div class="grpitem grpnew"><input type="text" class="grpname-in" maxlength="40" enterkeyhint="done" placeholder="Название группы" aria-label="Название новой группы">' +
          '<button type="button" class="stgbtn primary" data-a="create">Создать</button></div>'
        : '<button type="button" class="addstage grpaddbtn" data-a="add">+ Новая группа</button>';
      list.style.setProperty('--grp-def', curFace().doneBg);
      list.innerHTML = html;
      shown = {};
      var rows = list.querySelectorAll('[data-row]');
      rows.forEach(function(r){ if(r.getAttribute('data-on') === '1') shown[r.getAttribute('data-row')] = 1; });
      if(rows.length){
        void list.offsetHeight;                                  // the old state is laid out, then the rows go to the new one
        rows.forEach(function(r){ r.classList.toggle('open', r.getAttribute('data-on') === '1'); });
      }
      list.querySelectorAll('[data-a="save"],[data-a="cancel"],[data-a="create"],[data-a="color"],[data-a="setcol"]').forEach(keepFocus);
      var inp = list.querySelector('.grpname-in');
      if(inp){
        if(editId){ var g0 = groupById(editId); inp.value = typed !== null ? typed : (g0 ? g0.name : ''); }
        inp.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){ e.preventDefault(); act(adding ? 'create' : 'save', editId); }
          else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); editId = null; adding = false; fill(); }
        });
        try{ inp.focus({ preventScroll:true }); }catch(_){ inp.focus(); }
        try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(_){}
        revealInSheet(inp);
      }
    }
    function act(a, id, arg){
      if(a === 'out'){ set(null); label(); setOpen(false); return; }
      if(a === 'pick'){ set(id); label(); setOpen(false); return; }
      if(a === 'pen'){ if(editId === id){ editId = null; openPen = null; } else openPen = openPen === id ? null : id; fill(); return; }
      if(a === 'color'){ openCol = openCol === id ? null : id; fill(); return; }   // the same dot closes it, a colour chosen or not
      if(a === 'setcol'){
        var gg = groupById(id), c = grpColor(arg);
        if(gg && (gg.color || null) !== c){ if(c) gg.color = c; else delete gg.color; persistGroup(gg); }
        fill(); return;
      }
      if(a === 'ren'){ editId = id; adding = false; fill(); return; }
      if(a === 'cancel'){ editId = null; openPen = null; fill(); return; }
      if(a === 'save'){
        var inp = list.querySelector('.grpname-in'), v = inp ? inp.value.trim() : '', g = groupById(id);
        if(!v){ if(inp) inp.focus(); return; }                   // an empty name is not saved
        if(g && g.name !== v){ g.name = v.slice(0, 40); persistGroup(g); }
        editId = null; openPen = null; label(); fill(); return;
      }
      if(a === 'del'){                                         // at once: the group goes, its tasks stay without a group
        var wasCur = get() === id;
        removeGroup(id);
        if(wasCur) set(null);
        openPen = null; label(); fill(); return;
      }
      if(a === 'add'){ adding = true; editId = null; openPen = null; fill(); return; }
      if(a === 'create'){
        var ni = list.querySelector('.grpname-in'), name = ni ? ni.value.trim() : '';
        if(!name){ if(ni) ni.focus(); return; }
        var ng = newGroup(name, null, sphOf());
        set(ng.id); label(); setOpen(false); return;
      }
    }
    row.addEventListener('click', function(){
      var on = !drop.classList.contains('open');
      if(on){ fill(); setOpen(true); setTimeout(function(){ revealInSheet(box); }, 280); } else setOpen(false);
    });
    list.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-a]'); if(!b || b.tagName === 'INPUT') return;
      var it = b.closest('[data-id]');
      act(b.getAttribute('data-a'), it && it.getAttribute('data-id'), b.getAttribute('data-c'));
    });
    label();
    var api = { box: box, refresh: function(){
      label();
      var ae = document.activeElement;
      if(drop.classList.contains('open') && !(ae && list.contains(ae))) fill();   // not under the user's fingers
    } };
    groupPickers.push(api);
    return api;
  }

  /* ---- task detail ---- */
  function openTaskDetail(id){
    var t = tasks.find(function(x){ return x.id===id; });
    if(!t) return;
    if(t.imported){ delete t.imported; persistTask(t); }   // a task from a backup: the highlight goes once its card is opened
    var type = TYPES[t.type], st = STATUS[t.status];
    var full = FULL_TYPES.indexOf(t.type) >= 0;

    var f = function(label, val){ return val ? ('<div class="detailfield"><div class="dl">' + label + '</div><div class="dv">' + esc(val) + '</div></div>') : ''; };

    var html = '<h2>' + (t.title? esc(t.title): 'Без названия') + '</h2>' +
      '<div class="sheet-sub">' + esc(type.label) +
      ' · <span style="color:' + statusColor(t.status) + '">' + st.label + '</span>' +
      (t.noSphere ? ' · <span style="white-space:nowrap">без сферы</span>' : hasUserSpheres() && sphereOf(t) ? ' · <span style="white-space:nowrap"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:' +
        sphereOf(t).color + '"></i>' + esc(sphereOf(t).name || 'Сфера') + '</span>' : '') +
      (t.oldCopy ? ' · <span class="lintag">старая версия</span>' : (refreshDups(), hasDup(t)) ? ' · <span class="lintag lt-dup">имеется дубликат из копии</span>' : '') + '</div>';

    /* quick controls that used to sit on the list card */
    var isActive = t.status==='unset' || t.status==='setup' || t.status==='process';
    if(isActive){
      html += '<div class="detailctrls">' +
        '<button class="priobtn ' + (t.priority?'is-priority':'') + '" id="btnPrio">' +
          '<span class="fill"></span><span class="label">' + (t.priority ? 'Высокий приоритет' : 'Отметить важной') + '</span>' +
        '</button>' +
        (t.type==='periodic'
          ? '<span class="statuspill">Периодическая</span>'
          : '<button class="statusselect" id="btnStatus">' + esc(STATUS_SHORT[t.status] || st.label) + '<span class="caret">▾</span></button>') +
      '</div>';
    }

    if(t.type === 'periodic'){
      var dates = (t.scheduledDates||[]).slice().sort();
      if(dates.length){
        html += '<div class="detailfield"><div class="dl">Дни выполнения</div><ul class="stagelist" id="dateCheckList">' +
          dates.map(function(iso){
            var isDone = (t.datesDone||[]).indexOf(iso) >= 0;
            return '<li class="' + (isDone?'done':'') + '" data-diso="' + iso + '"><span class="sq"></span><span>' + esc(fmtDate(new Date(iso+'T00:00:00').getTime())) + '</span></li>';
          }).join('') + '</ul></div>';
      }
    }

    if(full){
      var silyInner = f('Управляющий', t.manager) + f('Исполнитель', t.executor);
      if(silyInner) html += '<div class="fieldsection"><div class="fs-title">КАДРЫ</div>' + silyInner + '</div>';
      var sredInner = f('Финансы', t.finance) + f('Инструменты', t.tools) + f('Ресурсы', t.resources);
      if(sredInner) html += '<div class="fieldsection"><div class="fs-title">СРЕДСТВА</div>' + sredInner + '</div>';
      html += f('Знания, умения, навыки', t.ksa);
      var subLi = function(s, i, k){ return '<li class="' + (s.done?'done':'') + '"' + (k === undefined ? '' : ' data-st="' + k + '"') + ' data-sidx="' + i + '"><span class="sq"></span><span>' + esc(s.text) + '</span></li>'; };
      if(isStaged(t)){
        html += '<div class="detailfield" id="stageCheckList"><div class="dl">Подзадачи</div>' +
          t.stagesV2.map(function(s, k){
            var c = stageCount(s), its = s.items || [];
            return '<div class="stgcard" data-st="' + k + '"><div class="stgcard-h"><span>' + esc(stageTitle(s, k)) + '</span><span class="cnt">' + c[0] + ' / ' + c[1] + '</span></div>' +
              '<div class="stgbar"><i style="width:' + (c[1] ? Math.round(c[0] / c[1] * 100) : 0) + '%"></i></div>' +
              (its.length ? '<ul class="stagelist">' + its.map(function(x, i){ return subLi(x, i, k); }).join('') + '</ul>' : '') + '</div>';
          }).join('') + '</div>';
      } else if(t.stages && t.stages.length){
        html += '<div class="detailfield"><div class="dl">Подзадачи</div><ul class="stagelist" id="stageCheckList">' +
          t.stages.map(function(s, i){ return subLi(s, i); }).join('') +
          '</ul></div>';
      }
      html += f('Описание результата', t.resultDescription);
      html += f('Реквизиты отчётов', t.reportRequisites);
    } else {
      html += f('Примечание', t.note);
    }

    if(t.status==='archived'){
      html += f('Причина отложения', DELAY[t.delayReason] || '');
      html += f('Подробнее', t.delayDetail);
    }
    if(t.report){
      var reportInner = f('Дата', t.report.date) + f('Содержание', t.report.text);
      if(reportInner) html += '<div class="fieldsection"><div class="fs-title">ОТЧЁТ</div>' + reportInner + '</div>';
    }

    if(t.type==='current'){
      html += '<div class="ctrlblock"><div class="fs-title">КОНТРОЛЬ ВЫПОЛНЕНИЯ</div>' + buildDayControlGrid(t) + '</div>';
    } else if(t.type==='perspective'){
      html += '<div class="ctrlblock"><div class="fs-title">КОНТРОЛЬ ВЫПОЛНЕНИЯ</div>' + buildMonthControlGrid(t) + '</div>';
    }

    html += '<div class="sheet-actions" style="margin-top:10px;">' +
      '<button class="btn btn-secondary" id="btnEdit">Редактировать</button>';
    if(t.status==='unset') html += '<button class="btn btn-primary" id="btnAdvance">Поставить</button>';
    else if(t.status==='setup') html += '<button class="btn btn-primary" id="btnAdvance">В процесс</button>';
    else if(t.status==='process') html += '<button class="btn btn-primary" id="btnComplete">Завершить</button>';
    else if(t.status==='archived' || t.status==='cancelled') html += '<button class="btn btn-primary" id="btnReopen">Возобновить</button>';
    html += '</div>';
    if(COMPLETED.indexOf(t.status)>=0){
      var onlyHide = currentTab === 'manage' && keptElsewhere(t);
      html += '<div class="sheet-actions"><button class="btn btn-danger" id="btnDeleteFromList" style="flex:1;">Удалить из списка</button></div>' +
        (onlyHide ? '<div class="hint" style="text-align:center;margin-top:-2px;">Задача уйдёт только из «Управления» и останется в «' + (t.status === 'archived' ? 'Архиве' : 'Отчётах') + '»</div>' : '');
    }

    openSheet(html);
    var bp = document.getElementById('btnPrio');
    if(bp) wireHold(bp, function(){
      setPriority(t, !t.priority);
      bp.classList.toggle('is-priority', !!t.priority);
      bp.querySelector('.label').textContent = t.priority ? 'Высокий приоритет' : 'Отметить важной';
    });
    var bs = document.getElementById('btnStatus'); if(bs) bs.addEventListener('click', function(){ openStatusPicker(t.id); });
    var be = document.getElementById('btnEdit'); if(be) be.addEventListener('click', function(){ openTaskForm(t.id, t.type); });
    var ba = document.getElementById('btnAdvance'); if(ba) ba.addEventListener('click', function(){ t.status = (t.status==='unset') ? 'setup' : 'process'; persistTask(t); closeSheet(); });
    var bc = document.getElementById('btnComplete'); if(bc) bc.addEventListener('click', function(){ closeSheet(); setTimeout(function(){ openCompletionSheet(t.id); }, 180); });
    var br = document.getElementById('btnReopen'); if(br && t.noSphere && hasUserSpheres()) br.addEventListener('click', function(e){ e.stopImmediatePropagation(); closeSheet(); setTimeout(function(){ openReturnSheet(t.id); }, 180); });   // §8.4: a task of a deleted sphere
    if(br) br.addEventListener('click', function(){ if(t.noSphere){ if(hasUserSpheres()) return; delete t.noSphere; } t.status='process'; t.delayReason=null; persistTask(t); closeSheet(); });
    var bdel = document.getElementById('btnDeleteFromList'); if(bdel) bdel.addEventListener('click', function(){
      if(currentTab === 'manage' && keptElsewhere(t)) hideFromManage(t);   // «Управление»: archived or reported tasks are only taken off the list
      else deleteTask(t.id);                                               // «Архив», «Отчёты» and the other finished tasks: deleted
      closeSheet(); render();
    });

    var stageList = document.getElementById('stageCheckList');
    if(stageList){
      stageList.querySelectorAll('li').forEach(function(li){
        li.addEventListener('click', function(){
          var i = +li.getAttribute('data-sidx'), k = li.getAttribute('data-st');
          var stg = k === null ? null : (t.stagesV2 || [])[+k];
          var arr = k === null ? t.stages : (stg && stg.items);
          if(!arr || !arr[i]) return;
          arr[i].done = !arr[i].done;
          persistTask(t);
          li.classList.toggle('done', arr[i].done);
          if(stg){                                   // the stage's counter and strip follow at once
            var card = li.closest('.stgcard'), c = stageCount(stg);
            if(card){ card.querySelector('.cnt').textContent = c[0] + ' / ' + c[1]; card.querySelector('.stgbar i').style.width = (c[1] ? Math.round(c[0] / c[1] * 100) : 0) + '%'; }
          }
        });
      });
    }
    var dateList = document.getElementById('dateCheckList');
    if(dateList){
      dateList.querySelectorAll('li').forEach(function(li){
        li.addEventListener('click', function(){
          var iso = li.getAttribute('data-diso');
          t.datesDone = t.datesDone || [];
          var idx = t.datesDone.indexOf(iso);
          if(idx>=0) t.datesDone.splice(idx,1); else t.datesDone.push(iso);
          persistTask(t);
          li.classList.toggle('done', t.datesDone.indexOf(iso)>=0);
        });
      });
    }
    wireControlGrid(sheetEl.querySelector('.ctrlgrid'), t);
  }

  /* ---- new task: with more than one sphere on the screen, the sphere first (only the active ones); then the category ---- */
  function sphDot(c){ return '<span class="dot" style="background:' + c + '"></span>'; }
  /* §8.3: «+» while no sphere works now — one button that goes straight to a new sphere's settings */
  var ADD_SPH = 'Добавить и настроить сферу деятельности';
  function openNoSphereSheet(){
    openSheet('<h2>Новая задача</h2><div class="sheet-sub">На это время сфера деятельности не настроена</div>' +
      '<button type="button" class="btn btn-primary btn-block" id="nsAdd">' + ADD_SPH + '</button>');
    document.getElementById('nsAdd').addEventListener('click', function(){ closeSheet(); setTimeout(function(){ if(sphWin) sphWin.openAdd(); }, 180); });
  }
  /* §8.4: «Возобновить» on a task of a deleted sphere — all own spheres except the switched-off ones, and «Добавить и настроить …» */
  function openReturnSheet(id){
    var t = tasks.find(function(x){ return x.id === id; }); if(!t) return;
    var list = userSpheres().filter(function(s){ return s.mode !== 'off'; });
    var back = function(sid){ t.sphereId = sid; delete t.noSphere; delete t.groupId; t.status = 'process'; t.delayReason = null; persistTask(t); render(); };
    openSheet('<h2>В какую сферу вернуть задачу?</h2><div class="sheet-sub">' + esc(t.title || 'Без названия') + '</div>' +
      (list.length ? '<div class="outcomegrid">' + list.map(function(sp){
        return '<button class="outcomeopt" data-s="' + esc(sp.id) + '">' + sphDot(sp.color) + '<span class="name">' + esc(sp.name || 'Сфера') + '</span></button>';
      }).join('') + '</div>' : '') +
      '<button type="button" class="btn btn-secondary btn-block" id="rtAdd" style="margin-top:8px">' + ADD_SPH + '</button>');
    sheetEl.querySelectorAll('.outcomeopt[data-s]').forEach(function(b){
      b.addEventListener('click', function(){ back(b.getAttribute('data-s')); closeSheet(); });
    });
    document.getElementById('rtAdd').addEventListener('click', function(){
      closeSheet();
      setTimeout(function(){ if(sphWin) sphWin.openAdd(function(sid){ back(sid); }); }, 180);
    });

  function openSpherePickSheet(list){

    function buildDueMonthHtml(year, month){
      var first = new Date(year, month, 1);

      var todayIso = todayISO();
      var cells = '';
      for(var i=0; i<startOffset; i++){ cells += '<span class="calcell pad"></span>'; }
      for(var d=1; d<=daysCount; d++){
        var iso = isoDate(year, month, d);
        var cls = 'calcell';
        if(iso === todayIso) cls += ' today';
        if(iso === dueLocal) cls += ' due-selected';
        cells += '<button type="button" class="' + cls + '" data-dv="' + iso + '">' + d + '</button>';
      }
      return '<div class="calmonth"><div class="calmonth-title">' + MONTH_NAMES_RU[month] + ' ' + year + '</div>' +
        '<div class="calweekdays">' + WEEKDAY_SHORT_RU.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div>' +
        '<div class="calgrid">' + cells + '</div></div>';
    }

    function renderDueWrap(){
      var wrap = document.getElementById('dueWrap');
      if(!wrap) return;

        var now = new Date();
        var next = new Date(now.getFullYear(), now.getMonth()+1, 1);
        wrap.innerHTML = buildDueMonthHtml(now.getFullYear(), now.getMonth()) + buildDueMonthHtml(next.getFullYear(), next.getMonth());
        wrap.querySelectorAll('.calcell:not(.pad)').forEach(function(cell){
          cell.addEventListener('click', function(){
            var v = cell.getAttribute('data-dv');
            dueLocal = (dueLocal === v) ? null : v;
            renderDueWrap();
          });
        });
        return;
      } else {
        var y1 = new Date().getFullYear(), y2 = y1 + 1;
        var col1 = '', col2 = '';
        for(var m=0;m<12;m++){
          var key1 = monthKey(y1, m);
          col1 += '<button type="button" class="ctrlcell ctrlcell-month' + (key1===dueLocal?' due-selected':'') + '" data-dv="' + key1 + '">' + MONTH_SHORT_RU[m] + ' ' + y1 + '</button>';
          var key2 = monthKey(y2, m);

      wrap.querySelectorAll('.ctrlcell').forEach(function(cell){

    function renderCalendars(){
      var wrap = document.getElementById('calWrap');

      var now = new Date();
      var y1 = now.getFullYear(), m1 = now.getMonth();
      var next = new Date(y1, m1 + 1, 1);

      var stg = stgLocal ? JSON.parse(JSON.stringify(stgLocal)) : null;

        sub: JSON.parse(JSON.stringify(subLocal)), stg: stg, dates: datesLocal.slice(), manager: managerVal, executor: executorVal, due: dueLocal };

    var draftSig0 = null;

      st.scroll = sheetEl.scrollTop; st.ts = Date.now();

    if(draft && draft.scroll) setTimeout(function(){ sheetEl.scrollTop = draft.scroll; }, 60);

    document.getElementById('btnSave').addEventListener('click', function(){

      if(sphLocal && sphLocal !== MAIN_SPH && sphereById(sphLocal)){ t.sphereId = sphLocal; delete t.noSphere; } else if(!t.noSphere) delete t.sphereId;
      if(full){

        if(stgLocal) document.querySelectorAll('#subWrap .stgbox').forEach(function(b){

        });
        var keepSubs = function(arr){ return arr.filter(function(s){ return s.text && s.text.trim(); }).map(function(s){ return { text:s.text, done:!!s.done }; }); };
        if(stgLocal){
          t.stagesV2 = stgLocal.map(function(s, i){ return { id: s.id, name: s.custom ? s.name : 'Этап ' + (i + 1), custom: !!s.custom, items: keepSubs(s.items) }; });

  /* v45 §4: at the start — a task form left open when the app was unloaded comes back with what was typed */
  function restoreTaskDraft(){
    var d = draftGet(DRAFT_TASK); if(!d) return;
    var tries = 0;
    (function wait(){
      if(!draftGet(DRAFT_TASK)) return;
      if(++tries > 120) return;
      var ready = dataSeen.tasks && dataSeen.groups && dataSeen.spheres && !document.documentElement.classList.contains('booting') && overlay.hidden;
      if(!ready){ setTimeout(wait, 250); return; }
      if(!d.typeKey || !TYPES[d.typeKey]){ draftDel(DRAFT_TASK); return; }
      var t0 = d.id ? tasks.find(function(x){ return x.id === d.id; }) : null;
      if(d.id && !t0){
        draftDel(DRAFT_TASK);
        askDraft('Задача уже удалена', 'Создать заново из черновика?', 'Создать', function(){ var nd = Object.assign({}, d, { id: null, base: null }); openTaskForm(null, d.typeKey, d.sphLocal, nd); }, function(){});
        return;
      }
      if(t0 && d.base != null && t0.updatedAt !== d.base){
        draftDel(DRAFT_TASK);
        askDraft('Заменить данные из черновика?', 'Задача изменилась, пока форма была закрыта. Данные из черновика заменят её нынешние.', 'Заменить', function(){ openTaskForm(d.id, d.typeKey, null, d); }, function(){});
        return;
      }
      openTaskForm(d.id, d.typeKey, d.sphLocal, d);
    })();
  }

  /* ================= Картотека: тумба с ящиками =================
     Перенесена из приложения «Картотека». Верхний ящик — задачи текущей вкладки
     и категории (каждая папка — задача), нижний ящик пока прежний («Проекты»). */
  function createKart(opts){
    const $ = id => document.getElementById(id);
    const root=$('kart'), cab=$('kCab'), cabBody=$('kCabBody'), layer=$('kLayer'), traywrap=$('kTraywrap'), traystatic=$('kTraystatic'),
          tRim=$('kRim'), tWall=$('kWall'), tFloor=$('kFloor'), backwall=$('kBackwall'), fwrap=$('kFwrap'), fpersp=$('kFpersp'),
          mouth=$('kMouth'), lfront=$('kLfront'), liftSh=$('kLiftSh'), traycap=$('kTraycap'), dim=$('kDim'), hint=$('kHint');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const U = () => settings.ui;

    const plural = (n, f) => { const a = n % 100, b = n % 10; return f[(a > 10 && a < 20) ? 2 : b === 1 ? 0 : (b >= 2 && b <= 4) ? 1 : 2]; };
    const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
    const LN2 = Math.LN2;
    const L = x => { const a = Math.abs(x); return a + Math.log1p(Math.exp(-2 * a)) - LN2; }; // ln cosh

    // the bottom drawer's folders are the user's projects (filled by createProjects); the last folder is «+ Новый проект»
    const DATA = [
      { def: UI_DEF.titles[0], tone: 'sand', noun: ['задача','задачи','задач'], items: [] },
      { def: UI_DEF.titles[1], tone: 'kraft', noun: ['список','списка','списков'], items: [] },
    ];
    const tones = () => curTones();                // folder palettes of the current theme (and mode)

    const nOf = d => d.items.reduce((a, it) => a + (it.add || it.divider ? 0 : (it.count || 1)), 0);   // «+ Новый проект» is not a project, the divider is not a task; a collapsed group counts its tasks
    const TRASH_ICO = '<svg class="dico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';
    const LOCK_ICO = '<svg class="dico dlk" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
    // v46: in «Отчёты» the bottom drawer is «Удалённые записи» (a bin before the name, a lock when it has a password)
    const frontHTML = d => d.alt
      ? `<div class="card alt"><span><span>${TRASH_ICO}${esc(d.alt.title)}${d.alt.lock ? LOCK_ICO : ''}</span>${U().counter ? `<em>${d.alt.count}</em>` : ''}</span></div><div class="handle"></div>`
      : `<div class="card"><span><span><i style="background:${tones()[d.tone].dot}"></i>${esc(d.title)}</span>${U().counter ? `<em>${nOf(d)}</em>` : ''}</span></div><div class="handle"></div>` +
        (d.tag ? `<span class="dtag">${esc(d.tag)}</span>` : '');
    const ariaFor = d => d.alt ? `Открыть ящик «${d.alt.title}»${d.alt.lock ? ', закрыт паролем' : ''}` : `Открыть ящик «${d.title}», ${nOf(d)} ${plural(nOf(d), d.noun)}`;

    DATA.forEach((d, i) => { d.title = U().titles[i] || d.def; });
    const drawerEls = DATA.map((d, i) => {
      const el = document.createElement('div');
      el.className = 'dfront';
      el.tabIndex = 0; el.setAttribute('role', 'button');
      el.dataset.idx = i;
      cabBody.appendChild(el);
      return el;
    });
    function updateFront(i) {
      const d = DATA[i], el = drawerEls[i];
      el.innerHTML = frontHTML(d);
      el.setAttribute('aria-label', ariaFor(d));
      if (geo && geo.idx === i) lfront.innerHTML = frontHTML(d);
    }
    function applyTitles() {
      DATA.forEach((d, i) => { d.title = U().titles[i] || d.def; updateFront(i); });
    }

    // hint: the top drawer twitches until the first touch (can be switched off in settings)
    let touched = false, nudging = false;
    function stopNudge() { if (nudging) { drawerEls[0].classList.remove('nudge'); nudging = false; } }
    function startNudge() { if (!nudging && !reduce) { drawerEls[0].classList.add('nudge'); nudging = true; } }

    /* ---------- Folder artwork, painted once into a canvas (cheap to animate) ---------- */
    const TW = 96;
    const R = 5, TT = 2, TB = 8, FT = 13;       // tab top, body top, front-panel top (back strip TB→FT is 5 units)
    function backPath(VH, GW, rise) {           // the category tab on the left; a group's tab (GW wide) on the right,
      const bottom = `V${VH-R} Q300,${VH} ${300-R},${VH} H${R} Q0,${VH} 0,${VH-R} Z`;   // raised by «rise» on the last folder of a group
      const fallR = x => `H${x-6} Q${x-2},${TT} ${x+1},${TT+3} L${x+4},${TB-1} Q${x+6},${TB} ${x+9},${TB}`;
      let right = `H${300-R} Q300,${TB} 300,${TB+R}`;
      if (GW) {
        if (rise) {                               // the tall tab: its edge rises from the folder's top in one smooth S
          const top = TT - rise, a = TALL_X0, b = TALL_X1, c = (b - a) * 0.56;
          right = `H${a} C${a + c},${TB} ${b - c},${top} ${b},${top} H${300 - 9} Q300,${top} 300,${top + 9}`;
        } else {
          const xr = 300 - GW, top = TT, r2 = R;
          right = `H${xr-9} Q${xr-6},${TB} ${xr-4},${TB-1} L${xr-1},${top+3} Q${xr+2},${top} ${xr+6},${top} H${300-r2} Q300,${top} 300,${top+r2}`;
        }
      }
      return `M0,${TT+R} Q0,${TT} ${R},${TT} ${fallR(TW)} ${right} ${bottom}`;
    }
    /* a group's tab: its width (in the folder's 300 units) fits the name; on the last folder of a group the folder sits
       lower in its slot by E units and the tab rises into the freed space as a tall tab with «Свернуть» */
    const GRP_TALL = 31;                        // css px the tall tab adds above the folder
    const TALL_X0 = 122, TALL_X1 = 184;         // the tall tab: its S-shaped edge runs from x0 (at the folder's top) to x1 (its flat top)
    const hexA = (hex, a) => { const h = String(hex).replace('#', ''); if (h.length !== 6) return hex;
      return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
    function grpGeom(ctx, cv, it, dpr) {
      if (!it.ctl || !it.grp) return null;
      const u = (cv.width / dpr) / 300, UI = curFace().font;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.font = `700 9.5px ${UI}`;
      const tw = ctx.measureText(it.grp).width / u; ctx.restore();

       the part of the list that is left, and the button slides to its new place instead of jumping. */
    var baseH = 0, footTop = null;
    function viewH(){ var vv = window.visualViewport; return vv ? vv.height : window.innerHeight; }
    function typingIn(){ var a = document.activeElement; return !!(a && ov.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)); }
    function kbUp(){ return baseH > 0 && baseH - viewH() > 80; }
    function fitKb(){
      if(!openState) return;
      // a window from below is over the project window (e.g. «Переименовать проект»): leave the project window alone,
      // so the keyboard coming up for that window costs no layout or animation here
      if(!overlay.hidden || !subOverlay.hidden){ footTop = null; return; }
      var vv = window.visualViewport, h = viewH();
      var kb = typingIn() && kbUp();
      if(kb){
        // the panel keeps above the keyboard by the overlay's padding; the overlay itself (in the window's colour) still
        // covers the part under the keyboard, so nothing of the app behind flashes when the keyboard goes away
        var pt = Math.max(0, Math.round(vv ? vv.offsetTop : 0)) + 'px', pb = Math.max(0, Math.round(window.innerHeight - (vv ? vv.offsetTop : 0) - h)) + 'px';
        if(ov.style.paddingTop !== pt) ov.style.paddingTop = pt;
        if(ov.style.paddingBottom !== pb) ov.style.paddingBottom = pb;
        ov.style.background = 'var(--bg)';
      }
      else if(ov.style.paddingBottom || ov.style.paddingTop){ smoothShift(function(){ ov.style.paddingTop = ''; ov.style.paddingBottom = ''; ov.style.background = ''; }); }
      var foot = panel.querySelector('.pwin-foot'), ft = foot.getBoundingClientRect().top;
      if(footTop !== null && Math.abs(footTop - ft) > 2 && !reduce){
        foot.getAnimations().forEach(function(x){ x.cancel(); });
        foot.animate([{ transform: 'translateY(' + (footTop - ft) + 'px)' }, { transform: 'none' }], { duration: 260, easing: FLIP_EASE });
      }
      footTop = ft;
      if(field){ var fta = field.el.querySelector('.pf-text'); if(fta) grow(fta); }   // the visible part changed: re-fit the text box
      if(kb) setTimeout(function(){ reveal(true); }, 30);
    }
    ov.addEventListener('focusin', function(e){
      if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if(!kbUp()) baseH = viewH();                 // the full height, taken just before the keyboard comes up
    });
    if(window.visualViewport){ window.visualViewport.addEventListener('resize', fitKb); window.visualViewport.addEventListener('scroll', fitKb); }
    window.addEventListener('resize', fitKb);
    // «ВЕРНУТЬСЯ» with the keyboard up: the keyboard goes first, the return effect plays after it (not while the page is resizing)
    function afterKeyboard(fn){
      var t0 = performance.now();
      (function wait(){ if(!kbUp() || performance.now() - t0 > 600) setTimeout(fn, 40); else requestAnimationFrame(wait); })();
    }

    /* ---------- a folder was tapped ---------- */
    function tapFolder(id){
      if(repMode){ if(String(id).slice(0, 2) === 'd:' && id !== 'd:-') openDeleted(String(id).slice(2)); return; }
      if(id === 'p:+'){ newProject(); return; }
      if(id === 'p:~'){ openOrder(); return; }
      var p = byId(String(id).slice(2)); if(p) openWin(p);
    }
    /* the name sheet: a new project, or renaming one (the same tall sheet with the keyboard up at once) */
    function nameSheet(o){
      // 5/6 of the screen as it is now (before the keyboard), pinned from the top: the keyboard will not move it
      var vh = window.visualViewport ? Math.max(window.visualViewport.height, window.innerHeight) : window.innerHeight;
      var h = Math.round(vh * 5 / 6);
      openSheet('<div class="np-wrap"><h2>' + o.title + '</h2><div class="sheet-sub">' + o.sub + '</div>' +
        '<div class="field"><label for="npName">Название</label><input type="text" id="npName" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="Например, Поставщики"></div>' +
        '<div class="sheet-actions"><button type="button" class="btn btn-secondary" id="npNo">Отмена</button><button type="button" class="btn btn-primary" id="npYes">' + o.ok + '</button></div></div>',
        { top: vh - h, h: h });                     // slides up opaque and stays put while the keyboard comes up
      var inp = document.getElementById('npName');
      inp.value = o.value || '';
      var done = function(){
        var name = inp.value.trim().slice(0, 40); if(!name){ inp.focus(); return; }
        o.save(name); closeSheet();
      };
      document.getElementById('npNo').addEventListener('click', closeSheet);
      document.getElementById('npYes').addEventListener('click', done);
      inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); done(); } });
      // the tap that opened the sheet is followed by the browser's own mousedown on the backdrop; it must not take the focus away
      var guard = function(e){ if(!e.target.closest || !e.target.closest('.sheet button')) e.preventDefault(); };
      window.addEventListener('mousedown', guard, true);
      setTimeout(function(){ window.removeEventListener('mousedown', guard, true); }, 700);
      try{ inp.focus({ preventScroll: true }); }catch(_){ inp.focus(); }
      if(o.value){ try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(_){} }   // the cursor at the end of the name
    }
    function newProject(){
      nameSheet({ title: 'Новый список', sub: 'Список появится папкой в нижнем ящике.', ok: 'Создать', save: function(name){
        var mx = list.reduce(function(m, p){ return Math.max(m, p.order); }, -1);   // a new project goes to the end
        var p = { id: uid(), name: name, order: mx + 1, entries: [], createdAt: Date.now() };
        list.push(p); write(p);
      } });
    }

    /* ---------- the order window: the projects as folders; pressed, a folder grows a little and can be dragged ---------- */
    var oov = document.getElementById('orderWin'), opanel = document.getElementById('orderPanel'), olist = document.getElementById('orderList');
    var orderOpen = false, obusy = false, og = null, OFH = 78, OGAP = 8;
    // the list runs the other way from the numbering, like the drawer: the first project is at the bottom (the drawer's front)
    function orderShown(){ return activeSorted().reverse(); }
    function renderOrder(){
      var act = orderShown();
      if(!act.length){ olist.innerHTML = '<div class="owin-empty">Списков пока нет</div>'; return; }
      olist.innerHTML = act.map(function(p){ return '<div class="ofold" data-id="' + esc(p.id) + '"><div class="ofi"><canvas></canvas></div></div>'; }).join('');
      olist.querySelectorAll('.ofold').forEach(function(el, i){
        el.style.height = OFH + 'px';
        kart.drawFolder(el.querySelector('canvas'), 1, folderItem(act[i]));
      });
    }
    function openOrder(){
      if(busy || openState || orderOpen) return;
      orderOpen = true; obusy = true;
      document.getElementById('orderKicker').textContent = (settings.ui.titles && settings.ui.titles[1]) || UI_DEF.titles[1];
      oov.hidden = false; renderOrder(); olist.scrollTop = olist.scrollHeight;   // starts at the bottom: the first projects
      play(true, opanel).then(function(){ obusy = false; if(orderOpen) hideBehind(true); });
    }
    function closeOrder(){
      if(!orderOpen || obusy) return;
      oCancelPend(); if(og) oEnd();
      obusy = true;
      hideBehind(false);
      play(false, opanel).then(function(){
        oov.hidden = true; clearFx(opanel); orderOpen = false; obusy = false; olist.innerHTML = '';
        if(typeof afterSheetClosed === 'function') afterSheetClosed();
      });
    }
    document.getElementById('orderBack').addEventListener('click', closeOrder);
    olist.addEventListener('contextmenu', function(ev){ if(ev.target.closest('.ofold')) ev.preventDefault(); });
    // a swipe scrolls the list; a hold of 0.45 s lifts the folder (it grows a little) and only then it can be dragged
    var opend = null;
    function oCancelPend(){ if(opend){ clearTimeout(opend.timer); opend = null; } }
    olist.addEventListener('pointerdown', function(ev){
      if(ev.button > 0 || obusy || og || opend) return;
      var row = ev.target.closest('.ofold'); if(!row) return;
      opend = { id: ev.pointerId, row: row, x0: ev.clientX, y0: ev.clientY, y: ev.clientY };
      opend.timer = setTimeout(function(){ var p = opend; opend = null; if(p && !obusy && orderOpen) oStart(p); }, ev.pointerType === 'mouse' ? 250 : 450);
    });
    function oStart(p){
      var row = p.row, rows = Array.prototype.slice.call(olist.querySelectorAll('.ofold'));
      if(rows.indexOf(row) < 0) return;
      og = { id: p.id, row: row, rows: rows, i0: rows.indexOf(row), y0: p.y, y: p.y, scroll0: olist.scrollTop,
             tops: rows.map(function(r){ return r.offsetTop; }), hs: rows.map(function(r){ return r.offsetHeight; }) };
      og.to = og.i0; og.step = og.hs[og.i0] + OGAP;
      try{ olist.setPointerCapture(p.id); }catch(_){}
      rows.forEach(function(r){ if(r !== row) r.classList.add('shift'); });
      row.classList.add('lift');                  // held: the folder grows a little and lifts
      kart.haptic();
      og.raf = requestAnimationFrame(oAuto);
    }
    // while a folder is lifted the list must not scroll under the finger
    olist.addEventListener('touchmove', function(ev){ if(og && ev.cancelable) ev.preventDefault(); }, { passive: false });
    olist.addEventListener('pointermove', function(ev){
      if(opend && ev.pointerId === opend.id){
        opend.y = ev.clientY;
        if(Math.hypot(ev.clientX - opend.x0, ev.clientY - opend.y0) > 8) oCancelPend();   // a swipe: the list scrolls
        return;
      }
      if(og && ev.pointerId === og.id){ og.y = ev.clientY; oMove(); }
    });
    olist.addEventListener('pointerup', function(ev){ if(opend && ev.pointerId === opend.id) oCancelPend(); if(og && ev.pointerId === og.id) oEnd(); });
    olist.addEventListener('pointercancel', function(ev){ if(opend && ev.pointerId === opend.id) oCancelPend(); if(og && ev.pointerId === og.id) oEnd(); });
    olist.addEventListener('scroll', oCancelPend, { passive: true });
    function oMove(){
      var s = og; if(!s) return;
      var n = s.rows.length, dy = s.y - s.y0 + (olist.scrollTop - s.scroll0);
      var minDy = -s.tops[s.i0], maxDy = (s.tops[n - 1] + s.hs[n - 1]) - (s.tops[s.i0] + s.hs[s.i0]);
      dy = clamp(dy, minDy - 12, maxDy + 12);
      s.row.style.transform = 'translateY(' + dy + 'px)';
      var c = s.tops[s.i0] + s.hs[s.i0] / 2 + dy, to = s.i0, j;
      for(j = s.i0 + 1; j < n; j++) if(c > s.tops[j] + s.hs[j] / 2) to = j;
      for(j = s.i0 - 1; j >= 0; j--) if(c < s.tops[j] + s.hs[j] / 2) to = j;
      if(to !== s.to){
        s.to = to;
        s.rows.forEach(function(r, k){
          if(k === s.i0) return;
          var sh = (k > s.i0 && k <= to) ? -s.step : (k < s.i0 && k >= to) ? s.step : 0;
          r.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
        });
      }
    }
    function oAuto(){
      var s = og; if(!s) return;
      var lr = olist.getBoundingClientRect(), edge = 56, v = 0;
      if(s.y < lr.top + edge) v = -Math.ceil((lr.top + edge - s.y) / 5);
      else if(s.y > lr.bottom - edge) v = Math.ceil((s.y - (lr.bottom - edge)) / 5);
      if(v){ var before = olist.scrollTop; olist.scrollTop += v; if(olist.scrollTop !== before) oMove(); }
      s.raf = requestAnimationFrame(oAuto);
    }
    function oEnd(){
      var s = og; og = null; cancelAnimationFrame(s.raf);
      var i0 = s.i0, to = s.to;
      var fin = to > i0 ? (s.tops[to] + s.hs[to]) - (s.tops[i0] + s.hs[i0]) : to < i0 ? s.tops[to] - s.tops[i0] : 0;
      obusy = true;
      s.row.classList.add('shift'); s.row.classList.remove('lift');
      s.row.style.transform = fin ? 'translateY(' + fin + 'px)' : '';
      setTimeout(function(){
        if(to !== i0){
          var act = orderShown(), moved = act.splice(i0, 1)[0]; act.splice(to, 0, moved);
          act.reverse().forEach(function(p, k){ if(p.order !== k){ p.order = k; write(p); } });
        }
        obusy = false;
        var st = olist.scrollTop; renderOrder(); olist.scrollTop = st;
      }, reduce ? 20 : 210);
    }

    /* ---------- backup: «Экспорт» / «Импорт» in «Параметры» ---------- */
    function exportData(){ return sorted().map(clone); }
    function exportDeleted(){ return dels.map(clone); }
    /* v47: the files of the records here (lists and deleted) that are on this device: [{ e, f, size }] */
    function mediaList(){
      var out = [];
      function add(e){ (e.audio || []).concat(e.images || []).forEach(function(x){ if(ATT.has(e.id, x.file)) out.push({ e: e.id, f: x.file, size: x.size || 0 }); }); }
      list.forEach(function(p){ p.entries.forEach(add); });
      dels.forEach(add);
      return out;
    }
    /* what the import has to copy: { from: the id in the archive, to: the id here, list: the descriptions } */
    function runMedia(jobs, media){
      var res = { skipped: 0, put: 0 }, chain = Promise.resolve();
      if(!media) return chain.then(function(){ return res; });
      jobs.forEach(function(j){
        j.list.forEach(function(x){
          chain = chain.then(function(){
            var data = media.get('media/' + j.from + '/' + x.file);
            if(!data) return;                                          // not in the archive: the record keeps a stub
            if(!ATT.ok){ res.skipped++; return; }
            return ATT.write(j.to, x.file, new Blob([data])).then(function(ok){ if(ok) res.put++; else res.skipped++; });
          });
        });
      });
      return chain.then(function(){ return res; });
    }
    /* the backup's deleted records are added (the ones already here, by id, stay as they are) */
    function importDeleted(arr, media){
      var have = {}; dels.forEach(function(d){ have[d.id] = 1; });
      var add = (arr || []).filter(function(d){ return d && d.id; }).map(normDel).filter(function(d){ return !have[d.id]; });
      if(add.length) delAdd(add);
      return runMedia(add.filter(function(d){ return d.audio || d.images; }).map(function(d){ return { from: d.id, to: d.id, list: (d.audio || []).concat(d.images || []) }; }), media);
    }

    /* ---------- v46: the deleted records of one list: restore or delete for good ---------- */
    function askSure(title, text, yesLabel, onYes){
      openSubSheet('<h2>' + title + '</h2><div class="sheet-sub">' + text + '</div>' +
        '<div class="sheet-actions"><button type="button" class="btn btn-secondary" id="dsNo">Отмена</button><button type="button" class="btn btn-danger" id="dsYes">' + yesLabel + '</button></div>');
      document.getElementById('dsNo').addEventListener('click', closeSubSheet);
      document.getElementById('dsYes').addEventListener('click', function(){ closeSubSheet(); onYes(); });
    }
    var shownDel = null;
    function openDeleted(listId){
      var es = dels.filter(function(d){ return d.listId === listId; }).sort(function(a, b){ return b.deletedAt - a.deletedAt; });
      if(!es.length){ shownDel = null; if(!overlay.hidden) closeSheet(); return; }
      shownDel = listId;
      var gone = es.some(function(d){ return d.listDeleted; }), name = es[0].listName || 'Без названия';
      var html = '<h2>' + esc(name) + '</h2><div class="sheet-sub">' + (gone ? 'Список удалён. ' : '') + es.length + ' ' + pl(es.length, ['запись', 'записи', 'записей']) + ' в ящике.</div>';
      if(gone) html += '<div class="sheet-actions" style="margin:0 0 12px"><button type="button" class="btn btn-secondary" id="dlResAll">Восстановить список</button><button type="button" class="btn btn-secondary" id="dlKillAll">Удалить навсегда</button></div>';
      html += '<div class="dlist">' + es.map(function(d){
        return '<div class="dcard" data-id="' + esc(d.id) + '"><div class="dt">' + esc(d.title.trim() || 'Без заголовка') + '</div>' +
          (d.text.trim() ? '<div class="dx">' + esc(d.text) + '</div>' : '') +
          ((d.audio || d.images) ? '<div class="dm">Вложения: ' + [(d.images ? 'картинки — ' + d.images.length : ''), (d.audio ? 'голос — ' + d.audio.length : '')].filter(Boolean).join(', ') + '</div>' : '') +
          '<div class="dm">Удалена ' + fmtDay(d.deletedAt) + ' · удалится через ' + daysLeft(d) + ' ' + delDaysWord(daysLeft(d)) + '</div>' +
          '<div class="dact"><button type="button" class="btn btn-secondary" data-a="res">Восстановить</button><button type="button" class="btn btn-secondary" data-a="del">Удалить навсегда</button></div></div>';
      }).join('') + '</div>';
      openSheet(html);
      var by = function(id){ for(var i = 0; i < es.length; i++) if(es[i].id === id) return es[i]; return null; };
      sheetEl.querySelectorAll('.dcard .dact button').forEach(function(b){
        b.addEventListener('click', function(){
          var d = by(b.closest('.dcard').getAttribute('data-id')); if(!d) return;
          if(b.getAttribute('data-a') === 'res'){ restoreEntries([d]); openDeleted(listId); }
          else askSure('Удалить навсегда?', 'Запись нельзя будет вернуть.', 'Удалить', function(){ delDrop([d.id]); openDeleted(listId); });
        });
      });
      var ra = document.getElementById('dlResAll'), ka = document.getElementById('dlKillAll');
      if(ra) ra.addEventListener('click', function(){ restoreEntries(es); shownDel = null; closeSheet(); });
      if(ka) ka.addEventListener('click', function(){
        askSure('Удалить навсегда?', 'Список «' + esc(name) + '» и его записи (' + es.length + ') будут удалены без возврата.', 'Удалить', function(){ delDrop(es.map(function(d){ return d.id; })); shownDel = null; closeSheet(); });
      });
    }
    setInterval(purge, 6 * 3600 * 1000);
    /* the backup's records are added, never written over: a project whose name is already here (letter case and spaces
       at the ends do not matter; an active project is preferred to an archived one) gets the records appended to its
       list; a project with a new name is created at the end of the drawer. Every added record gets a new id and stays
       highlighted until it is opened for editing. A window left open is closed first. */
    function importData(arr, media){
      var inc = (arr || []).filter(function(p){ return p && typeof p === 'object'; });
      var jobs = [], jobOf = {};
      if(!inc.length) return Promise.resolve({ skipped: 0, put: 0 });
      if(openState) closeWin(true);
      if(orderOpen){ oov.hidden = true; clearFx(opanel); orderOpen = false; obusy = false; og = null; olist.innerHTML = ''; }
      var key = function(n){ return String(n || '').trim().toLowerCase(); };
      inc.forEach(function(src){
        var name = String(src.name || '').trim().slice(0, 40) || 'Без названия';
        var entries = (Array.isArray(src.entries) ? src.entries : []).filter(function(e){ return e && (String(e.title || '').trim() || String(e.text || '').trim() || ATT.normAudio(e.audio).length || ATT.normImages(e.images).length); })
          .map(function(e){
            var o = { id: uid(), title: String(e.title || ''), text: String(e.text || ''), imp: true };
            var au = ATT.normAudio(e.audio), im = ATT.normImages(e.images);
            if(au.length) o.audio = au; if(im.length) o.images = im;
            if(au.length || im.length) jobOf[o.id] = { from: String(e.id), to: o.id, list: au.concat(im) };
            return o;
          });
        var same = list.filter(function(x){ return key(x.name) === key(name); });
        var p = same.filter(function(x){ return !x.archived; })[0] || same[0];
        if(p){
          // a record 100 % identical to one already in the project (same title and the same text) is not added again
          var sig = function(e){ return e.title.trim() + '\u0000' + e.text.replace(/\s+$/, ''); };
          var have = {}; p.entries.forEach(function(e){ have[sig(e)] = 1; });
          var add = entries.filter(function(e){ var k = sig(e); if(have[k]) return false; have[k] = 1; return true; });
          if(add.length){ p.entries = p.entries.concat(add); write(p); add.forEach(function(e){ if(jobOf[e.id]) jobs.push(jobOf[e.id]); }); }
        } else {
          var mx = list.reduce(function(m, x){ return Math.max(m, x.order); }, -1);
          var t = Date.now();
          p = { id: uid(), name: name, order: mx + 1, entries: entries, createdAt: t, archived: !!src.archived, archivedAt: src.archived ? t : 0 };
          list.push(p); write(p); entries.forEach(function(e){ if(jobOf[e.id]) jobs.push(jobOf[e.id]); });
        }
      });
      if(usingDbP && meta) meta.set({ seeded: true }).catch(function(){});
      if(!usingDbP){ try{ localStorage.setItem(LS_SEEDED, '1'); }catch(e){} }
      return runMedia(jobs, media);
    }

    initP();
    /* v45 §4: at the start — the record's form left open when the app was unloaded comes back with what was typed */
    function restoreEntryDraft(){
      var d = draftGet(DRAFT_ENTRY); if(!d) return;
      var tries = 0;
      (function wait(){
        if(!draftGet(DRAFT_ENTRY)) return;
        if(++tries > 120) return;
        var ready = list.length && !busy && !openState && overlay.hidden && !document.documentElement.classList.contains('booting');
        if(!ready){ setTimeout(wait, 250); return; }
        var p = byId(d.listId);
        if(!p || p.archived){ draftDel(DRAFT_ENTRY); return; }                     // the list is gone: nothing to come back to
        var open = function(pre){
          archMode = false;
          openWin(p);
          var n = 0;
          (function go(){
            if(busy && ++n < 60){ setTimeout(go, 100); return; }
            var row = pre.entryId ? listEl.querySelector('.prow[data-id="' + pre.entryId + '"]') : null;
            if(pre.entryId && !row){ draftDel(DRAFT_ENTRY); return; }
            openField(row, pre);
          })();
        };
        var e = d.entryId ? p.entries.filter(function(x){ return x.id === d.entryId; })[0] : null;
        if(d.entryId && !e){
          draftDel(DRAFT_ENTRY);
          askDraft('Запись уже удалена', 'Создать заново из черновика?', 'Создать', function(){ open(Object.assign({}, d, { entryId: null, orig: null })); }, function(){});
          return;
        }
        if(e && d.orig && (e.title !== d.orig[0] || e.text !== d.orig[1])){
          draftDel(DRAFT_ENTRY);
          askDraft('Заменить текст из черновика?', 'Запись изменилась, пока форма была закрыта. Текст из черновика заменит нынешний.', 'Заменить', function(){ open(Object.assign({}, d, { orig: [e.title, e.text] })); }, function(){});
          return;
        }
        open(d);
      })();
    }
    restoreEntryDraft();
    return { tapFolder: tapFolder, setMode: setMode, isOpen: function(){ return openState || orderOpen; }, exportData: exportData, importData: importData, mediaList: mediaList,
             exportDeleted: exportDeleted, importDeleted: importDeleted, countOlder: countOlder, purge: purge, onSettings: function(){ purge(); if(repMode) pushFolders(); },
             isLocked: function(){ return repMode && delLockActive(); }, askUnlock: askUnlock,
             fx: { play: play, hideBehind: hideBehind, clearFx: clearFx } };   // the window of spheres opens with the same effect
  }

  /* ================= Сферы деятельности: окно сфер и окно «Настроить» (v38) =================
     The window of spheres opens from the left shutter with the effect «Отдаление» (as the window of a list): a plate per
     sphere — the manual switch on the left (on: lit in the sphere's colour; off: «Авто»), the name with its colour and the
     state under it, «Настроить» on the right — and under them «Добавить и настроить сферу деятельности». «Настроить» opens
     over it: name, colour, days (weekdays or dates), hours, pause, theme, the word of the priority mark, staff; «ВЕРНУТЬСЯ»
     saves and goes back to the list. */
  function createSpheres(fx){
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function(id){ return document.getElementById(id); };
    var ov = $('sphWin'), panel = $('sphPanel'), body = $('sphBody');
    var cov = $('scfgWin'), cpanel = $('scfgPanel'), cbody = $('scfgBody'), ctitle = $('scfgTitle');
    var openState = false, busy = false, cfg = null, cbusy = false;
    var PEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/><path d="M13 20h8"/></svg>';
    // v43 §4: the middle place of «Выкл / … / Вкл» — a clock face instead of the word «Авто»
    var CLOCK_ICO = '<svg class="s3-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.1 2.1"/></svg>';

    /* ---------- the list of spheres ---------- */
    /* a three-way slider (§5 «Выкл / Авто / Вкл», §6 «Всегда / Дни недели / Даты»): a tap on a place puts the thumb there;
       the thumb can also be dragged with a finger and stops at the nearest place, a quick flick decides the side */
    // names (optional): what a place is called for the screen reader and the hint, when it shows a sign instead of a word
    function s3HTML(keys, labels, cur, cls, aria, names){
      var i = Math.max(0, keys.indexOf(cur));
      return '<div class="s3' + (cls ? ' ' + cls : '') + '" data-v="' + cur + '" style="--i:' + i + '" role="radiogroup" aria-label="' + aria + '"><span class="s3-th"></span>' +
        keys.map(function(k, n){ return '<button type="button" role="radio" data-k="' + k + '" aria-checked="' + (k === cur) + '"' + (k === cur ? ' class="on"' : '') +
          (names && names[n] ? ' aria-label="' + names[n] + '" title="' + names[n] + '"' : '') + '>' + labels[n] + '</button>'; }).join('') + '</div>';
    }
    function setS3(el, k){
      var bs = [].slice.call(el.querySelectorAll('button[data-k]')), i = bs.findIndex(function(b){ return b.getAttribute('data-k') === k; });
      if(i < 0) return;
      el.setAttribute('data-v', k); el.style.setProperty('--i', i);
      bs.forEach(function(b, n){ b.classList.toggle('on', n === i); b.setAttribute('aria-checked', n === i); });
    }
    function wireS3(root, onPick){
      var g = null;
      root.addEventListener('pointerdown', function(e){
        var el = e.target.closest && e.target.closest('.s3'); if(!el || e.button > 0) return;
        var r = el.getBoundingClientRect();
        g = { el: el, id: e.pointerId, x0: e.clientX, r: r, moved: false, i0: +el.style.getPropertyValue('--i') || 0, s: [[performance.now(), e.clientX]] };
      });
      root.addEventListener('pointermove', function(e){
        if(!g || e.pointerId !== g.id) return;
        var dx = e.clientX - g.x0;
        if(!g.moved){ if(Math.abs(dx) < 6) return; g.moved = true; try{ g.el.setPointerCapture(g.id); }catch(_){} g.el.classList.add('drag'); }
        var w = (g.r.width - 6) / 3, x = Math.max(0, Math.min(2 * w, g.i0 * w + dx));
        g.el.style.setProperty('--x', x + 'px');
        g.s.push([performance.now(), e.clientX]); if(g.s.length > 6) g.s.shift();
      });
      function end(e){
        if(!g || e.pointerId !== g.id) return;
        var st = g; g = null;
        var keys = [].map.call(st.el.querySelectorAll('button[data-k]'), function(b){ return b.getAttribute('data-k'); }), k;
        if(!st.moved){                                              // a tap: the place under the finger
          var w0 = st.r.width / 3; k = keys[Math.max(0, Math.min(2, Math.floor((e.clientX - st.r.left) / w0)))];
        } else {
          st.el.classList.remove('drag');
          var w = (st.r.width - 6) / 3, x = parseFloat(st.el.style.getPropertyValue('--x')) || 0, n = Math.round(x / w);
          var a = st.s[0], b = st.s[st.s.length - 1], v = (b[1] - a[1]) / Math.max(16, b[0] - a[0]);
          if(v > 0.45) n = Math.min(2, Math.max(n, st.i0 + 1)); else if(v < -0.45) n = Math.max(0, Math.min(n, st.i0 - 1));

      root.addEventListener('pointercancel', function(e){ if(g && e.pointerId === g.id){ g.el.classList.remove('drag'); g.el.style.removeProperty('--x'); g = null; } });
